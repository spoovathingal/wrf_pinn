[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf_pinn"
version = "0.0.1"
description = "WRF-focused physics-informed neural network for atmospheric winds."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
